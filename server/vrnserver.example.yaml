# vrnserver configuration (copy to vrnserver.yaml).
#
# Beds and devices are set on the VitalServer web monitor (My VR -> the vrcode -> beds): a bed's
# device gets port=<VRN MAC> or 4300@<VRN MAC>, e.g. 10bda3c85168 or 4300@10bda3c85168
# (10:bd:a3:c8:51:68 and 10-BD-A3-C8-51-68 also work). 4300 is this server's listen port below.

vitalserver: wss://mod.vitaldb.net:443   # intranet: ws://172.16.142.27:80
vrcodes: [abcd2345e]                     # the vrcodes (groups) this server records; several allowed

# Optional
# listen: 4300            # port the VRNs connect to (ws://<this server>:4300/vrn).
#                         # Behind nginx/TLS: 127.0.0.1:4300 and VRNs use wss://<name>/vrn
# data: ./data            # recordings (vital/), conf cache (conf/), state
# upload: off             # default: UPLOAD_SERVER_IP/SERVER_IP of the conf, else vitaldb.net
#                         # (cloud) or the intranet VitalServer itself; off = keep files here
# tls_verify: false       # accept a private TLS certificate of VitalServer / the upload server
#                         # (better: add the hospital CA to the OS trust store)
#
# Over-the-air VRN firmware updates (VRN 0.5.0+). Put the -app.bin and its .sig from the release
# in dir. Changes to vrcodes and ota apply when this file is saved (no restart).
# ota:
#   enable: true
#   dir: ./fw
#   version: "VRNIV 0.5.5"
#   images: {c5: vrn-c5-0.5.5-app.bin, c6: vrn-c6-0.5.5-app.bin, s3: vrn-s3-0.5.5-app.bin}
#   beds: []              # only these beds (empty = all)
#   force: false          # true = also while a patient is connected (VRN 0.5.2+)
#
# Advanced (long form, local conf files instead of VitalServer): see README "Configuration".
